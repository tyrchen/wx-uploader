# Copy to the site root as wx-uploader.yaml.
version: 1

content:
  include:
    - src/posts/**/*.md

images:
  root: public
  relative_to: root

frontmatter:
  title: title
  description: excerpt
  cover: cover

cover:
  mode: existing
  fit: contain

state:
  storage: sidecar
  path: .wx-uploader/state.json
